<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>简历配置 - AI 简历填表助手</title>
    <link rel="stylesheet" href="popup.css" />
    <link rel="stylesheet" href="resume-editor.css" />
  </head>
  <body class="resume-editor-page">
    <div class="editor-shell">
      <header class="editor-header">
        <div class="editor-header-main">
          <img class="logo-icon" src="icons/icon128.png" alt="AI 简历填表助手图标" />
          <div class="editor-header-copy">
            <h1>简历配置</h1>
            <p>维护一份资料，快速复用到不同申请表单</p>
          </div>
        </div>
        <div class="editor-toolbar">
          <select id="resumeTemplateSelect" class="template-select" aria-label="当前简历"></select>
          <button class="btn btn-outline btn-sm" id="newTemplateBtn">新建</button>
          <details class="editor-menu">
            <summary class="btn btn-outline btn-sm">更多</summary>
            <div class="editor-menu-content">
              <button class="btn btn-outline btn-sm" id="duplicateTemplateBtn">复制</button>
              <button class="btn btn-outline btn-sm" id="renameTemplateBtn">重命名</button>
              <button class="btn btn-outline btn-sm" id="deleteTemplateBtn">删除</button>
              <button class="btn btn-outline btn-sm" id="reloadResumeBtn">重新加载</button>
            </div>
          </details>
          <button class="btn btn-primary" id="saveResumeBtn">保存</button>
          <details class="editor-menu editor-management">
            <summary class="btn btn-outline btn-sm">简历管理</summary>
            <div class="editor-menu-content">
              <div class="action-row">
                <button class="btn btn-outline btn-sm" id="importTemplatesBtn" title="导入备份，覆盖全部简历">导入全部</button>
                <button class="btn btn-outline btn-sm" id="exportTemplatesBtn">导出全部</button>
              </div>
              <section id="resumeSyncPanel"></section>
            </div>
          </details>
        </div>
      </header>

      <main class="editor-main">
        <div class="resume-editor-layout resume-editor-layout-wide">
          <aside class="resume-nav" id="resumeNav"></aside>
          <div class="resume-form-host" id="resumeFormHost"></div>
        </div>

        <details class="editor-import-section">
          <summary class="editor-import-header">AI 预填</summary>
          <div class="editor-import-body">
            <div class="form-group" style="margin-bottom:0">
              <label for="resumeImportText">原始简历文本</label>
              <textarea
                id="resumeImportText"
                class="textarea"
                placeholder="粘贴原始简历文本，或上传 PDF 后自动填入这里。"
              ></textarea>
            </div>
            <div class="action-row">
              <button class="btn btn-primary" id="importResumeBtn">AI 预填</button>
              <button class="btn btn-outline" id="uploadPdfBtn">从 PDF 预填</button>
            </div>
          </div>
          <input type="file" id="resumePdfFile" accept="application/pdf" hidden />
        </details>
      </main>
    </div>

    <div class="editor-status" id="pageStatus" data-status="info" role="status" aria-live="polite" aria-atomic="true" hidden></div>

    <input type="file" id="importTemplatesFile" accept="application/json" hidden />

    <div class="modal" id="templateNameModal" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="templateNameModalTitle">
      <div class="modal-backdrop" id="closeTemplateNameBackdrop"></div>
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="templateNameModalTitle">新建模板</h3>
          <button class="icon-btn" id="closeTemplateNameBtn" type="button" aria-label="关闭模板名称窗口">
            <svg
              width="20"
              height="20"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label for="templateNameInput">模板名称</label>
            <input
              type="text"
              id="templateNameInput"
              placeholder="例如：测开 / 游戏开发 / 普通开发"
            />
          </div>
          <div class="config-status" id="templateNameStatus" role="status" aria-live="polite"></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-primary btn-block" id="saveTemplateNameBtn">保存</button>
        </div>
      </div>
    </div>

    <script src="libs/pdfjs/pdf.min.js"></script>
    <script src="shared/resume-schema.js"></script>
    <script src="shared/resume-storage.js"></script>
    <script src="shared/model-storage.js"></script>
    <script src="shared/ai-client.js"></script>
    <script src="shared/resume-prompts.js"></script>
    <script src="shared/resume-date-control.js"></script>
    <script src="resume-editor.js"></script>
    <script src="shared/resume-sync-ui.js"></script>
  </body>
</html>
